apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    project: roboshop
    environment: dev
spec:
  selector:
    project: roboshop
    tier: frontend
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx #Pod name
  labels:
    project: roboshop
    environment: dev
    purpose: frontend
    tier: frontend
spec:
  containers:
  - name: nginx #Container name
    image: nginx #by default it will get form docker hub
